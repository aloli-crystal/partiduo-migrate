nl:
  migrate:
    rolled_back: "Migratie teruggedraaid: de instantie is niet gewijzigd."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Gebruik: partiduo-migrate <opdracht> [opties]

        Opdrachten:
          import      neemt een dossier over in de instantie van DATABASE_URL (nieuwe instantie)
          check       controleert een bron en berekent haar cijfers, zonder iets te schrijven
          export-fec  schrijft de FEC van een oorspronkelijke databank (DBVERSION %{dbversion})

        Bronnen (import, check):
          --fec BESTAND          Frans boekingenbestand (tab of verticale streep als scheidingsteken)
          --legacy-db URL          Oorspronkelijke databank, via een Unix-socket: postgres:///dossier?host=/tmp
          --encoding NAAM        codering van de FEC (utf-8, iso-8859-15, windows-1252); standaard: herkend

        Migratie (import):
          --report MAP           map van het afstemmingsverslag (standaard rapport-reprise)
          --as-of JJJJ-MM-DD     referentiedatum van de ouderdomsbalans (standaard: afsluitdatum van de FEC)
          --fiscal-start MM      eerste maand van de boekjaren aangemaakt voor een FEC (standaard: volgens de naam)
          --dry-run              proefdraai: alles wordt uitgevoerd en daarna teruggedraaid
          --strict               een waarschuwing (fiche, btw, bijlage) doet ook mislukken

        Export (export-fec):
          --output MAP|BESTAND       standaard: huidige map, wettelijke naam SIRENFECJJJJMMDD.txt
          --separator tab|pipe       standaard tab
          --out-encoding NAAM        standaard iso-8859-15
          --siren NUMMER             standaard: parameters van het oorspronkelijke dossier

        Alle opdrachten:
          --locale TAAL          taal van de berichten en het verslag (%{locales}); standaard fr
