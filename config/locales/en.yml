en:
  migrate:
    rolled_back: "Migration rolled back: the instance was not changed."
    error: "%{field}: %{message}"
    cli:
      usage: |-
        Usage: partiduo-migrate <command> [options]

        Commands:
          import      migrates a set of books into the DATABASE_URL instance (new instance)
          check       checks a source and computes its figures, without writing anything
          export-fec  writes the FEC of a NOALYSS database (DBVERSION %{dbversion})

        Sources (import, check):
          --fec FILE             French accounting entries file (tab or vertical bar separated)
          --noalyss URL          NOALYSS database, through a Unix socket: postgres:///books?host=/tmp
          --encoding NAME        FEC encoding (utf-8, iso-8859-15, windows-1252); default: detected

        Migration (import):
          --report DIR           reconciliation report directory (default rapport-reprise)
          --as-of YYYY-MM-DD     reference date of the aged balance (default: FEC closing date)
          --fiscal-start MM      first month of the fiscal years created for a FEC (default: from the name)
          --dry-run              dry run: everything is done then rolled back
          --strict               a warning (card, VAT, attachment) also makes it fail

        Export (export-fec):
          --output DIR|FILE          default: current directory, statutory name SIRENFECYYYYMMDD.txt
          --separator tab|pipe       default tab
          --out-encoding NAME        default iso-8859-15
          --siren NUMBER             default: NOALYSS company settings

        All commands:
          --locale LANGUAGE      language of messages and report (%{locales}); default fr
      unknown_locale: "unknown language “%{locale}” (expected: %{locales})"
      unknown_command: "unknown command “%{command}”"
      fiscal_start: "--fiscal-start: month expected (1 to 12)"
      separator: "--separator: tab or pipe"
      invalid_option: "unknown option: %{option}"
      missing_value: "missing value: %{option}"
      unexpected_argument: "unexpected argument: %{argument}"
